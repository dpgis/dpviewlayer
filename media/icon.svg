<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 100 100" role="img">
  <title>View Layer</title>
  <circle cx="50" cy="50" r="48" fill="#DAE0E8"/>
  <defs>
    <clipPath id="bowl">
      <!-- Inside stroke (r=22, stroke/2?5) so all 9 cells stay visible -->
      <circle cx="50" cy="50" r="16.5"/>
    </clipPath>
  </defs>
  <!-- 9 distinct cells (no borders): white yellow purple / cyan green orange / blue pink red -->
  <g clip-path="url(#bowl)">
    <rect x="33.5" y="33.5" width="11" height="11" fill="#F8FAFC"/>
    <rect x="44.5" y="33.5" width="11" height="11" fill="#FACC15"/>
    <rect x="55.5" y="33.5" width="11" height="11" fill="#A855F7"/>
    <rect x="33.5" y="44.5" width="11" height="11" fill="#22D3EE"/>
    <rect x="44.5" y="44.5" width="11" height="11" fill="#22C55E"/>
    <rect x="55.5" y="44.5" width="11" height="11" fill="#F97316"/>
    <rect x="33.5" y="55.5" width="11" height="11" fill="#3B82F6"/>
    <rect x="44.5" y="55.5" width="11" height="11" fill="#EC4899"/>
    <rect x="55.5" y="55.5" width="11" height="11" fill="#EF4444"/>
  </g>
  <g fill="none" stroke="#1A8CFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="50" r="22"/>
    <line x1="28" y1="50" x2="28" y2="78"/>
    <line x1="72" y1="22" x2="72" y2="50"/>
  </g>
</svg>
