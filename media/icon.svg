<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 100 100" role="img">
    <title>View Layer</title>

    <!-- 半径为20的圆形区域绘制-->
    <!-- 9 distinct cells (no borders): white yellow purple / cyan green orange / blue pink red -->
    <g clip-path="url(#bowl)">
        <rect x="30" y="30" width="13.5" height="13.5" fill="#F8FAFC" />
        <rect x="43.5" y="30" width="13.5" height="13.5" fill="#FACC15" />
        <rect x="57" y="30" width="13.5" height="13.5" fill="#A855F7" />
        <rect x="30" y="43.5" width="13.5" height="13.5" fill="#22D3EE" />
        <rect x="43.5" y="43.5" width="13.5" height="13.5" fill="#22C55E" />
        <rect x="57" y="43.5" width="13.5" height="13.5" fill="#F97316" />
        <rect x="30" y="57" width="13.5" height="13.5" fill="#3B82F6" />
        <rect x="43.5" y="57" width="13.5" height="13.5" fill="#EC4899" />
        <rect x="57" y="57" width="13.5" height="13.5" fill="#EF4444" />
    </g>

    <circle cx="50" cy="50" r="20" stroke-width="1" fill="none" stroke="#FFFFFF" />
    <circle cx="50" cy="50" r="42" stroke-width="16" fill="none" stroke="#DAE0E8" />
    <g fill="none" stroke="#1A8CFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="50" cy="50" r="27" />
        <line x1="23" y1="50" x2="23" y2="82" />
        <line x1="77" y1="18" x2="77" y2="50" />
    </g>
</svg>
